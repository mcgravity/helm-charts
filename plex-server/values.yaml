  type: NodePort
serviceAccount:
  annotations: {}
  create: false
  name: ''
tolerations: []
useHostNetwork: true
volumeMounts:
- mountPath: /config
  name: plex-config-path
- mountPath: /data
  name: plex-data-path
- mountPath: /extra-data
