    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
nameOverride: ''
namespace: home-media
nodeSelector:
  beta.kubernetes.io/arch: amd64
persistentVolumeConfig:
  claimName: nfs-plex-config-claim
  enabled: true
  name: nfs-plex-config
  nfs:
    path: /export/plex-config
